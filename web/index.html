<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('crautosdb_theme');
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersLight ? 'light' : 'dark');
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'light' ? '#f8fafc' : '#0f172a');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta name="description" content="Todos los autos usados de Crautos en un solo lugar: precios de mercado, gangas, estadísticas y asistente con IA." />
    <meta property="og:title" content="Happy Customer" />
    <meta property="og:description" content="Todos los autos usados de Crautos en un solo lugar: precios de mercado, gangas, estadísticas y asistente con IA." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />
    <title>Happy Customer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

  </body>
</html>
